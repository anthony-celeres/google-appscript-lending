<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #ffffff;
        --border-color: #cbd5e1;
        --blue-primary: #1d4ed8;
        --blue-hover: #1e40af;
        --text-main: #0f172a;
        --text-muted: #64748b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 24px;
      }
      .header-card {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid #e2e8f0;
      }
      .icon-box {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
      }
      h3 { font-size: 17px; font-weight: 800; color: #1e3a8a; letter-spacing: -0.01em; }
      p.subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
      .form-group { margin-bottom: 14px; }
      label {
        display: block;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #334155;
        margin-bottom: 6px;
      }
      input, select {
        width: 100%;
        padding: 11px 13px;
        border-radius: 12px;
        border: 1.5px solid var(--border-color);
        background-color: #ffffff;
        font-size: 13.5px;
        color: var(--text-main);
        outline: none;
        transition: all 0.2s ease;
      }
      input:focus, select:focus {
        border-color: var(--blue-primary);
        box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
      }
      .notice-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 11.5px;
        color: #475569;
        margin-bottom: 16px;
        line-height: 1.4;
      }
      .btn {
        width: 100%;
        padding: 13px;
        background-color: var(--blue-primary);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px -1px rgba(29, 78, 216, 0.2);
      }
      .btn:hover { background-color: var(--blue-hover); transform: translateY(-1px); }
      #status { margin-top: 14px; font-size: 12.5px; font-weight: 600; text-align: center; }
    </style>
  </head>
  <body>
    <div class="header-card">
      <div class="icon-box">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1d4ed8" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div>
        <h3>Edit Borrower Info</h3>
        <p class="subtitle">Modify member contact info & cascade name updates</p>
      </div>
    </div>

    <form id="editBorrowerForm" onsubmit="saveBorrowerEdit(event)">
      <div class="form-group">
        <label>Select Member / Borrower</label>
        <select id="borrowerSelect" onchange="onBorrowerSelectChange()" required>
          <option value="">-- Loading Borrowers... --</option>
        </select>
      </div>

      <div id="editFields" style="display:none;">
        <div class="form-group">
          <label>Borrower Full Name</label>
          <input type="text" id="borrowerName" required />
        </div>

        <div class="form-group">
          <label>Home Address</label>
          <input type="text" id="address" />
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="phone" placeholder="+63 9xx xxx xxxx" />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="member@example.com" />
        </div>

        <div class="notice-box">
          <strong>Auto-Cascade:</strong> If the name is changed, it will automatically update across all linked Loans, Amortization schedules, and Payments.
        </div>

        <button type="submit" class="btn" id="saveBtn">Save Profile Changes</button>
      </div>
      <div id="status"></div>
    </form>

    <script>
      let borrowersList = [];

      google.script.run
        .withSuccessHandler(function(list) {
          borrowersList = list || [];
          const sel = document.getElementById('borrowerSelect');
          sel.innerHTML = '';
          if (borrowersList.length === 0) {
            sel.innerHTML = '<option value="">-- No borrowers found --</option>';
            return;
          }
          sel.innerHTML = '<option value="">-- Choose Member to Edit --</option>';
          borrowersList.forEach(b => {
            sel.innerHTML += `<option value="${b.borrowerId}">${b.borrowerId} - ${b.borrowerName}</option>`;
          });

          // Auto-select preselected borrower if passed
          const targetId = window.preselectedId || window.preselectedLoanId;
          if (targetId && borrowersList.some(b => b.borrowerId === targetId)) {
            sel.value = targetId;
            onBorrowerSelectChange();
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('status').innerHTML = '<span style="color:#dc2626;">Error loading borrowers: ' + err.message + '</span>';
        })
        .getAllBorrowersForEdit();

      function onBorrowerSelectChange() {
        const id = document.getElementById('borrowerSelect').value;
        const b = borrowersList.find(item => item.borrowerId === id);
        const fields = document.getElementById('editFields');
        if (!b) {
          fields.style.display = 'none';
          return;
        }
        document.getElementById('borrowerName').value = b.borrowerName;
        document.getElementById('address').value = b.address;
        document.getElementById('phone').value = b.phone;
        document.getElementById('email').value = b.email;
        fields.style.display = 'block';
      }

      function saveBorrowerEdit(e) {
        e.preventDefault();
        const id = document.getElementById('borrowerSelect').value;
        if (!id) return;

        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = 'Saving Changes...';
        document.getElementById('status').innerHTML = '<span style="color:#1d4ed8;">Updating profile and cascading changes...</span>';

        const payload = {
          borrowerId: id,
          borrowerName: document.getElementById('borrowerName').value,
          address: document.getElementById('address').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value
        };

        google.script.run
          .withSuccessHandler(function(res) {
            document.getElementById('status').innerHTML = '<span style="color:#059669;">Borrower profile updated successfully!</span>';
            setTimeout(() => google.script.host.close(), 1800);
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = 'Save Profile Changes';
            document.getElementById('status').innerHTML = '<span style="color:#dc2626;">Error: ' + err.message + '</span>';
          })
          .processUpdateBorrower(payload);
      }
    </script>
  </body>
</html>
